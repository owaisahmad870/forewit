[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.39"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = false
bytecode_hash = "ipfs"
remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "forge-std/=lib/forge-std/src/",
]

[fuzz]
runs = 2000

[invariant]
runs = 256
depth = 64
fail_on_revert = false

[rpc_endpoints]
bsc = "${BSC_RPC_URL}"
bsc_testnet = "${BSC_TESTNET_RPC_URL}"

[etherscan]
bsc = { key = "${ETHERSCAN_API_KEY}", chain = 56 }
bsc_testnet = { key = "${ETHERSCAN_API_KEY}", chain = 97 }
