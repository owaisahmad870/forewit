<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Forewit wallet test</title>
<style>body{font:16px/1.5 system-ui,sans-serif;background:#0d1420;color:#e7ecf4;margin:0;padding:24px}button{font:inherit;padding:12px 18px;border-radius:10px;border:0;background:#a594ff;color:#0d1420;font-weight:700}pre{white-space:pre-wrap;word-break:break-all;background:#141d2c;padding:12px;border-radius:10px}</style>
</head>
<body>
<h1>Forewit wallet test</h1>
<p>Read only. This page asks which wallet the browser connects. It never asks for a signature or a transaction.</p>
<button id="go">Connect and show my address</button>
<pre id="out">Waiting.</pre>
<script>
// Agent ID holder (Agentic Wallet) of the project owner, for comparison only
const AGENTIC = '0x4db416baf0127adca78e7571038b763868ff282c';
const out = document.getElementById('out');
const show = (o) => { out.textContent = JSON.stringify(o, null, 2); };
const providers = () => ({ binancew3w: window.binancew3w && window.binancew3w.ethereum, ethereum: window.ethereum });
document.getElementById('go').onclick = async () => {
  const report = { userAgent: navigator.userAgent, found: Object.fromEntries(Object.entries(providers()).map(([k, v]) => [k, Boolean(v)])) };
  for (const [name, p] of Object.entries(providers())) {
    if (!p) continue;
    try {
      const accounts = await p.request({ method: 'eth_requestAccounts' });
      const chainId = await p.request({ method: 'eth_chainId' });
      report[name] = { accounts, chainId, isAgenticWallet: accounts.map((a) => a.toLowerCase() === AGENTIC) };
    } catch (e) { report[name] = { error: String(e && e.message || e) }; }
  }
  show(report);
};
</script>
</body>
</html>
