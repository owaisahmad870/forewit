# Builds web/ and deploys it to Cloudflare Pages (project "forewit"), with the latest data the keeper published
# on the keeper-state branch. Runs on site changes, after every keeper run, and by hand.
name: site

on:
  push:
    branches: [main]
    paths: ["web/**", "functions/**", "mcp/src/**", "wrangler.toml", ".github/workflows/site.yml"]
  workflow_run:
    workflows: [keeper]
    types: [completed]
  workflow_dispatch:
  schedule:
    - cron: "*/20 * * * *" # fresh data from the chain every 20 minutes, not only when a keeper run ends

permissions:
  contents: read

concurrency:
  group: site
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - name: Latest keeper data
        run: |
          git fetch --depth 1 origin keeper-state && git worktree add ../state FETCH_HEAD || exit 0
          [ -d ../state/web/public/data ] && cp -r ../state/web/public/data/. web/public/data/ || true
          for d in keeper/archive indexer/out; do [ -d "../state/$d" ] && mkdir -p "$d" && cp -r "../state/$d/." "$d/" || true; done
      - run: npm ci --no-audit --no-fund
      # rebuild the snapshot from chain events now (read only, keyed RPCs merged with publicnode); on any failure the
      # keeper's last published data above stays in place
      - name: Fresh data from the chain
        continue-on-error: true
        env:
          RPC: ${{ secrets.RPC_MAINNET_PRIMARY }}
          LEDGER: ${{ vars.LEDGER_MAINNET }}
          FROM: ${{ vars.INDEXER_FROM_BLOCK_MAINNET }}
        run: |
          [ -n "$LEDGER" ] && [ -n "$FROM" ] || exit 0
          node indexer/publish.mjs --network mainnet --ledger "$LEDGER" --from-block "$FROM" ${RPC:+--rpc "$RPC"}
      - run: npm ci --no-audit --no-fund
        working-directory: web
      - run: npm run build
        working-directory: web
      # functions/mcp.js (the read only MCP connector at /mcp) bundles mcp/src with its own dependencies
      - name: MCP connector dependencies
        continue-on-error: true
        run: npm ci --no-audit --no-fund && node scripts/build.mjs
        working-directory: mcp
      - name: Deploy to Cloudflare Pages
        env:
          RAW_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # the secret was stored from a Windows clipboard: drop a byte order mark and line endings
          export CLOUDFLARE_API_TOKEN="$(printf '%s' "$RAW_TOKEN" | sed 's/^\xEF\xBB\xBF//' | tr -d '\r\n ')"
          npx --yes wrangler@4 pages project create forewit --production-branch main || true
          # the site and its data must never wait on the connector: if the deploy with functions/ fails, deploy without it
          npx --yes wrangler@4 pages deploy web/dist --project-name forewit --branch main --commit-dirty=true || {
            echo "deploy with the MCP function failed; deploying the site without it"
            mv functions functions.off
            npx --yes wrangler@4 pages deploy web/dist --project-name forewit --branch main --commit-dirty=true
          }
