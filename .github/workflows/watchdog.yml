# Independent missed duty watchdog: reads chain state only (no keys), every 30 minutes, alerts on Telegram.
# Needs repository variable LEDGER_MAINNET and secrets TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID (RPC_MAINNET_PRIMARY and RPC_MAINNET_FALLBACK, HC_PING_WATCHDOG_GH).
name: watchdog

on:
  schedule:
    - cron: "20,50 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: write # night_backup starts the keeper night job by workflow_dispatch

jobs:
  watchdog:
    if: vars.LEDGER_MAINNET != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - run: npm ci --no-audit --no-fund
      - name: Restore keeper state (read only; boards and the unsettled set)
        run: |
          git fetch --depth 1 origin keeper-state || exit 0
          git worktree add ../state FETCH_HEAD
          for d in keeper/state keeper/archive; do [ -d "../state/$d" ] && mkdir -p "$d" && cp -r "../state/$d/." "$d/" || true; done
      - name: Check every duty of the recent rounds
        env:
          LEDGER_MAINNET: ${{ vars.LEDGER_MAINNET }}
          RPC_MAINNET_PRIMARY: ${{ secrets.RPC_MAINNET_PRIMARY }}
          RPC_MAINNET_FALLBACK: ${{ secrets.RPC_MAINNET_FALLBACK }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          HC_PING_WATCHDOG: ${{ secrets.HC_PING_WATCHDOG_GH }}
          TOPIC_ROUNDS: ${{ vars.TOPIC_ROUNDS }}
        run: node keeper/keeper.mjs watchdog --network mainnet

  # Backup trigger for the deadline: this schedule is proven to fire, so between 21:00 and 22:50 UTC it starts the
  # keeper night job when none is queued or running (night is idempotent: a second start finds the work done).
  night_backup:
    if: github.event_name == 'schedule' && vars.KEEPER_NETWORK != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Start night if none is active
        run: |
          now=$(date -u +%H%M)
          if [ "$now" -lt 2100 ] || [ "$now" -gt 2250 ]; then echo "outside 21:00 to 22:50 UTC ($now)"; exit 0; fi
          active=$(gh run list -R "$GITHUB_REPOSITORY" -w keeper.yml --json status,createdAt --jq '[.[] | select(.status == "in_progress" or .status == "queued")] | length')
          if [ "$active" -gt 0 ]; then echo "keeper run already active ($active)"; exit 0; fi
          gh workflow run keeper.yml -R "$GITHUB_REPOSITORY" -f duty=night -f network="${{ vars.KEEPER_NETWORK }}" -f round=latest
          echo "night dispatched at $now UTC"
